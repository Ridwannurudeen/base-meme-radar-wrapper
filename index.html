<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Meme Radar</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0b0f2a, #1b1f4a);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: white;
      }

      .card {
        background: rgba(255, 255, 255, 0.08);
        padding: 32px;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        max-width: 320px;
        width: 100%;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        font-size: 14px;
        opacity: 0.85;
        margin-bottom: 24px;
      }

      a {
        display: inline-block;
        background: #5865f2;
        color: white;
        padding: 14px 22px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4);
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>🚀 Base Meme Radar</h1>
      <p>
        Live tracker for the most traded Base meme coin in the last 24 hours.
      </p>

      <a href="https://base-topmeme-radar.lovable.app">
        Open App
      </a>
    </div>
  </body>
</html>
